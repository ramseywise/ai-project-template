# Lint settings for THIS repo's own template sources (template/_scaffold/**.py).
#
# Not rendered into scaffolded projects: copier renders from `_subdirectory:
# template`, so this root file is outside its scope. Rendered projects get their
# settings from template/_scaffold/pyproject.toml.jinja instead.
#
# It exists because ruff resolves settings from the config nearest each file, and
# the nearest one here is a Jinja *template* (pyproject.toml.jinja) that ruff
# cannot parse. With no resolvable config, ruff silently falls back to its
# built-in defaults — line-length 88, E+F rules — and reports template sources as
# violations when they are correct under the settings the rendered project (and
# its CI) actually uses. Keep these values in sync with the [tool.ruff] block in
# pyproject.toml.jinja.
line-length = 100
target-version = "py312"

# template/.claude/ is vendored payload synced one-way from ~/.claude by
# scripts/sync-global-skills.sh — never edited here, and its eval fixtures
# contain deliberate lint findings the evals exist to catch. force-exclude
# keeps the exclusion in effect when files are passed by name (the Stop hook
# lints changed files explicitly).
extend-exclude = ["template/.claude"]
force-exclude = true

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001-003: typographic unicode in prose; N803/N806: ML naming (X, y, X_train)
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N803", "N806"]

[lint.isort]
# Mirror of pyproject.toml.jinja's known-first-party, with the templated roots
# resolved to their copier defaults (ml_source_root=ml, run_registry_root=
# experiments, eval_root=evals). Without this pin, ruff at the repo root
# classifies scaffold packages as third-party (their directories carry Jinja
# names it cannot resolve) and I001 demands an import order that the rendered
# project's own lint would then reject.
known-first-party = [
    "agents",
    "context_budget",
    "core",
    "evals",
    "experiments",
    "guardrails",
    "integrations",
    "middleware",
    "ml",
    "observability",
]
